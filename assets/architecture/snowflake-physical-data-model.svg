<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Trend Zone Snowflake physical data model</title>
  <desc id="desc">Entity relationship diagram for customers, stores, offline orders, offline order items and products.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071426" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#69d6d3"/>
    </marker>
    <style>
      .bg { fill: #244a78; }
      .panel { fill: #1d3d66; stroke: #58cfcc; stroke-width: 2.5; rx: 7; filter: url(#shadow); }
      .head { fill: #173557; stroke: #58cfcc; stroke-width: 2.5; }
      .title { fill: #ffffff; font: 700 18px Arial, sans-serif; letter-spacing: .5px; }
      .field { fill: #edf8ff; font: 15px Arial, sans-serif; }
      .key { fill: #7de4df; font: 700 14px Arial, sans-serif; }
      .rel { fill: none; stroke: #69d6d3; stroke-width: 2.5; marker-end: url(#arrow); }
      .card { fill: #ffffff; font: 700 16px Arial, sans-serif; }
      .caption { fill: #bfe7f2; font: 14px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="760"/>
  <text x="700" y="42" text-anchor="middle" class="title" font-size="24">TREND ZONE · SNOWFLAKE PHYSICAL DATA MODEL</text>
  <text x="700" y="68" text-anchor="middle" class="caption">Logical relationships used by the analytics transformation layer</text>

  <!-- Customers -->
  <g>
    <rect class="panel" x="45" y="130" width="245" height="270"/>
    <rect class="head" x="45" y="130" width="245" height="48" rx="7"/>
    <text class="title" x="168" y="160" text-anchor="middle">CUSTOMERS</text>
    <text class="key" x="65" y="207">PK</text><text class="field" x="105" y="207">customer_id</text>
    <text class="field" x="65" y="237">first_name</text>
    <text class="field" x="65" y="267">last_name</text>
    <text class="field" x="65" y="297">email</text>
    <text class="field" x="65" y="327">phone</text>
    <text class="field" x="65" y="357">loyalty_tier</text>
    <text class="field" x="65" y="387">customer_origin</text>
  </g>

  <!-- Offline orders -->
  <g>
    <rect class="panel" x="390" y="95" width="285" height="365"/>
    <rect class="head" x="390" y="95" width="285" height="48" rx="7"/>
    <text class="title" x="532" y="125" text-anchor="middle">OFFLINE_ORDERS</text>
    <text class="key" x="410" y="173">PK</text><text class="field" x="450" y="173">transaction_id</text>
    <text class="key" x="410" y="203">FK</text><text class="field" x="450" y="203">customer_id</text>
    <text class="key" x="410" y="233">FK</text><text class="field" x="450" y="233">store_id</text>
    <text class="field" x="410" y="263">purchase_timestamp</text>
    <text class="field" x="410" y="293">currency</text>
    <text class="field" x="410" y="323">subtotal</text>
    <text class="field" x="410" y="353">discount</text>
    <text class="field" x="410" y="383">tax</text>
    <text class="field" x="410" y="413">revenue</text>
    <text class="field" x="410" y="443">channel</text>
  </g>

  <!-- Order items -->
  <g>
    <rect class="panel" x="770" y="115" width="280" height="320"/>
    <rect class="head" x="770" y="115" width="280" height="48" rx="7"/>
    <text class="title" x="910" y="145" text-anchor="middle">OFFLINE_ORDER_ITEMS</text>
    <text class="key" x="790" y="193">PK</text><text class="field" x="830" y="193">line_item_id</text>
    <text class="key" x="790" y="223">FK</text><text class="field" x="830" y="223">transaction_id</text>
    <text class="key" x="790" y="253">FK</text><text class="field" x="830" y="253">product_id</text>
    <text class="field" x="790" y="283">sku</text>
    <text class="field" x="790" y="313">quantity</text>
    <text class="field" x="790" y="343">unit_price</text>
    <text class="field" x="790" y="373">line_total</text>
    <text class="field" x="790" y="403">created_at</text>
  </g>

  <!-- Products -->
  <g>
    <rect class="panel" x="1140" y="140" width="220" height="245"/>
    <rect class="head" x="1140" y="140" width="220" height="48" rx="7"/>
    <text class="title" x="1250" y="170" text-anchor="middle">PRODUCTS</text>
    <text class="key" x="1160" y="218">PK</text><text class="field" x="1200" y="218">product_id</text>
    <text class="field" x="1160" y="248">sku</text>
    <text class="field" x="1160" y="278">product_name</text>
    <text class="field" x="1160" y="308">category</text>
    <text class="field" x="1160" y="338">unit_price</text>
    <text class="field" x="1160" y="368">created_at</text>
  </g>

  <!-- Stores -->
  <g>
    <rect class="panel" x="410" y="535" width="245" height="195"/>
    <rect class="head" x="410" y="535" width="245" height="48" rx="7"/>
    <text class="title" x="532" y="565" text-anchor="middle">STORES</text>
    <text class="key" x="430" y="613">PK</text><text class="field" x="470" y="613">store_id</text>
    <text class="field" x="430" y="643">store_name</text>
    <text class="field" x="430" y="673">city</text>
    <text class="field" x="430" y="703">state · country</text>
  </g>

  <!-- Relationships -->
  <path class="rel" d="M290 255 H390"/>
  <text class="card" x="305" y="245">1</text><text class="card" x="368" y="245">N</text>

  <path class="rel" d="M675 255 H770"/>
  <text class="card" x="690" y="245">1</text><text class="card" x="748" y="245">N</text>

  <path class="rel" d="M1140 255 H1050"/>
  <text class="card" x="1115" y="245">1</text><text class="card" x="1060" y="245">N</text>

  <path class="rel" d="M532 535 V460"/>
  <text class="card" x="546" y="520">1</text><text class="card" x="546" y="485">N</text>

  <text class="caption" x="340" y="280" text-anchor="middle">places</text>
  <text class="caption" x="723" y="280" text-anchor="middle">contains</text>
  <text class="caption" x="1095" y="280" text-anchor="middle">describes</text>
  <text class="caption" x="552" y="503">fulfils</text>
</svg>
